name: Feature or task
description: New functionality, a page, an endpoint or a technical task
title: "feat(<scope>): "
labels: ["type: feature"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [open issues](https://github.com/YastecHub/pans-unilag-website/issues) first so we don't duplicate work. Read [CONTRIBUTING.md](https://github.com/YastecHub/pans-unilag-website/blob/main/CONTRIBUTING.md) before picking this up.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What should exist when this is done, and why?
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      description: Concrete steps, as a checklist.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How a reviewer will know it's done. Make each one testable.
      value: |
        - [ ]
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: ["client", "server", "admin", "infra", "content"]
      multiple: true
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: ["P0: launch blocker", "P1: should ship Friday", "P2: after launch"]
    validations:
      required: true
  - type: input
    id: depends
    attributes:
      label: Depends on
      description: Issue numbers that must be done first, e.g. "#3, #7"
  - type: input
    id: refs
    attributes:
      label: README / design references
      description: Links to the relevant README section or design file
