name: Bug report
description: Something on the site or in the code is broken
title: "fix(<scope>): "
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1. Go to …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page or endpoint
      description: e.g. /events or GET /api/events
  - type: dropdown
    id: device
    attributes:
      label: Device
      options: ["Phone", "Tablet", "Laptop/desktop", "Not device-specific"]
  - type: input
    id: browser
    attributes:
      label: Browser and version
      description: e.g. Chrome 130 on Android
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or error messages
      description: Remove any personal information before posting.
  - type: dropdown
    id: priority
    attributes:
      label: How bad is it?
      options: ["P0: blocks launch or exposes data", "P1: important but has a workaround", "P2: minor"]
    validations:
      required: true
