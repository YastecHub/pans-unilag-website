<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PANS UNILAG: Service to Humanity</title>
    <meta
      name="description"
      content="Pharmaceutical Association of Nigeria Students, University of Lagos (PANS UNILAG). Service to Humanity. Events, leadership, opportunities and student services for every pharmacy student at UNILAG."
    />
    <meta name="theme-color" content="#0e6434" />

    <!-- Icons and install, made from the PANS badge (README → Performance, SEO and accessibility) -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      Link previews (WhatsApp, Facebook, LinkedIn, X). These apps don't run JavaScript, so every
      page shares this site-wide preview. __SITE_URL__ is replaced at build time with VITE_SITE_URL
      (vite.config.ts): previews need absolute https addresses.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PANS UNILAG" />
    <meta property="og:locale" content="en_NG" />
    <meta property="og:title" content="PANS UNILAG: Service to Humanity" />
    <meta
      property="og:description"
      content="Pharmaceutical Association of Nigeria Students, University of Lagos. Service to Humanity."
    />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-default.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The PANS UNILAG badge: a mortar and pestle, “Faculty of Pharmacy” and “Service to humanity”"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@PANS_Unilag" />
    <!--
      Sets the light/dark theme before the first paint, so the page never flashes the wrong one.
      Mirrors src/lib/theme.ts (same storage key "pans-theme").
    -->
    <script>
      ;(function () {
        var theme
        try {
          theme = localStorage.getItem('pans-theme')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        }
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
